<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 3" shape-rendering="crispEdges">
  <!-- row 1: white, cyan, magenta -->
  <rect width="1" height="1" fill="#ffffff" />
  <rect x="1" width="1" height="1" fill="#00AEEF" />
  <rect x="2" width="1" height="1" fill="#EC008C" />
  <!-- row 2: yellow, black, white -->
  <rect y="1" width="1" height="1" fill="#FFF200" />
  <rect x="1" y="1" width="1" height="1" fill="#0A0A0A" />
  <rect x="2" y="1" width="1" height="1" fill="#ffffff" />
  <!-- row 3: red, green, blue -->
  <rect y="2" width="1" height="1" fill="#ff0000" />
  <rect x="1" y="2" width="1" height="1" fill="#00ff00" />
  <rect x="2" y="2" width="1" height="1" fill="#0000ff" />
</svg>
